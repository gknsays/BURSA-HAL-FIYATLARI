name: Shorts tetikleyici

# NE ISE YARAR?
# gknsays/shorts deposundaki video uretme workflow'unu tetikler.
#
# NEDEN BURADA DURUYOR?
# GitHub, yeni olusturulan depolarda zamanlanmis isleri hemen devreye almiyor.
# shorts deposu bugun olusturuldu ve cron'u hic calismadi (6+ saat boyunca sifir
# zamanlanmis calistirma). Bu depoda ise zamanlama yillardir sorunsuz calisiyor -
# 30+ basarili zamanlanmis calistirma var. Bu yuzden tetiklemeyi buradan
# yapiyoruz: calisan zamanlayici, calismayan depoyu durtuyor.
#
# shorts deposunun kendi cron'u devreye girdiginde bu dosya silinebilir. Iki
# tetikleme ust uste gelse bile shorts tarafindaki slot bekcisi (slotGuard.mjs)
# ayni slot icin ikinci video uretilmesini engelliyor - yani cift yayin riski yok.
#
# GEREKEN SECRET: SHORTS_DISPATCH_TOKEN
#   Fine-grained personal access token, sadece gknsays/shorts deposuna erisimli,
#   Repository permissions > Actions: Read and write

on:
  schedule:
    # Her 20 dakikada bir, UTC 10:00-21:59 (TRT 13:00-00:59).
    # Asil karari shorts tarafindaki slot bekcisi veriyor; buradan gelen
    # tetiklemelerin cogu orada ~20 saniyede sonlaniyor.
    - cron: "*/20 10-21 * * *"
  workflow_dispatch: {}

jobs:
  tetikle:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: shorts deposundaki workflow'u tetikle
        env:
          TOKEN: ${{ secrets.SHORTS_DISPATCH_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::SHORTS_DISPATCH_TOKEN secret'i tanimli degil."
            echo "Repo > Settings > Secrets and variables > Actions > New repository secret"
            exit 1
          fi

          # force=false gonderiyoruz: shorts tarafindaki bekci devreye girsin ve
          # sadece bekleyen bir yayin slotu varsa video uretilsin.
          KOD=$(curl -sS -o /tmp/yanit.txt -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            https://api.github.com/repos/gknsays/shorts/actions/workflows/shorts-scheduler.yml/dispatches \
            -d '{"ref":"main","inputs":{"force":"false"}}')

          echo "HTTP $KOD"
          cat /tmp/yanit.txt

          # GitHub bu API'de basarida 204 (bos yanit) donuyor.
          if [ "$KOD" != "204" ]; then
            echo "::error::Tetikleme basarisiz (HTTP $KOD)"
            exit 1
          fi
          echo "✅ shorts workflow'u tetiklendi"
